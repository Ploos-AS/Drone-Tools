services:
  drone-tools:
    build: .
    image: ghcr.io/ploos-as/drone-tools:dev
    container_name: drone-tools
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - drone-tools-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/usr/local/bin/drone-tools-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  drone-tools-data:
