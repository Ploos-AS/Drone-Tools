name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Format check
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Files requiring gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/drone-tools
      - name: Build arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/drone-tools

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime smoke image
        run: docker build -t drone-tools:ci .
      - name: Verify configured runtime user
        run: test "$(docker image inspect drone-tools:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Run container smoke test
        run: |
          docker run -d --name drone-tools-ci \
            --read-only \
            --tmpfs /tmp \
            -p 127.0.0.1:18080:8080 \
            drone-tools:ci
          trap 'docker logs drone-tools-ci; docker rm -f drone-tools-ci' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Build multi-architecture OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
